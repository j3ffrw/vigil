opencollection: 1.0.0

info:
  name: Vigil Manager API
  version: v1
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: basic
    username: ""
    password: "{{auth_token}}"
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
